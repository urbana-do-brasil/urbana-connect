spring:
  application:
    name: urbana-connect
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/urbana-connect}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    br.com.urbana: INFO

whatsapp:
  api:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  webhook:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

handoff:
  human:
    recipient: ${HANDOFF_EMAIL_RECIPIENT:comunicacao@urbanadobrasil.com}

openclaw:
  poc:
    enabled: ${OPENCLAW_POC_ENABLED:false}
    base-url: ${OPENCLAW_POC_BASE_URL:http://localhost:8787}
    turn-path: ${OPENCLAW_POC_TURN_PATH:/conversation-turn}
    timeout-ms: ${OPENCLAW_POC_TIMEOUT_MS:4000}
    max-reply-length: ${OPENCLAW_POC_MAX_REPLY_LENGTH:1024}
    fallback-text: ${OPENCLAW_POC_FALLBACK_TEXT:Estou com uma instabilidade momentanea aqui. Pode me enviar sua mensagem novamente em instantes?}
