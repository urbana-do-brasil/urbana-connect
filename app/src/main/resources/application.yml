spring:
  application:
    name: urbana-connect
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/urbana-connect}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    br.com.urbana: INFO

whatsapp:
  webhook:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
