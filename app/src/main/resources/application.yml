spring:
  application:
    name: urbana-connect
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/urbana-connect}
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    br.com.urbana: INFO

whatsapp:
  webhook:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}

ai:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

handoff:
  human:
    recipient: ${HANDOFF_EMAIL_RECIPIENT:comunicacao@urbanadobrasil.com}
