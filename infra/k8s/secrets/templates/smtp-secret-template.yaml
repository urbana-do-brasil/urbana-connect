apiVersion: v1
kind: Secret
metadata:
  name: urbana-connect-smtp
  namespace: urbana-connect-hml
type: Opaque
stringData:
  MAIL_HOST: "PLACEHOLDER_MAIL_HOST"
  MAIL_PORT: "587"
  MAIL_USERNAME: "PLACEHOLDER_MAIL_USERNAME"
  MAIL_PASSWORD: "PLACEHOLDER_MAIL_PASSWORD"
  HANDOFF_EMAIL_RECIPIENT: "PLACEHOLDER_HANDOFF_EMAIL_RECIPIENT"

# ATENÇÃO: Este é apenas um TEMPLATE e não deve ser aplicado diretamente.
# Para criar o secret real:
#
# kubectl create secret generic urbana-connect-smtp \
#   --namespace=urbana-connect-hml \
#   --from-literal=MAIL_HOST='smtp.gmail.com' \
#   --from-literal=MAIL_PORT='587' \
#   --from-literal=MAIL_USERNAME='seu_email@urbanadobrasil.com' \
#   --from-literal=MAIL_PASSWORD='sua_app_password' \
#   --from-literal=HANDOFF_EMAIL_RECIPIENT='comunicacao@urbanadobrasil.com' \
#   --dry-run=client -o yaml | kubectl apply -f -
