apiVersion: v1
kind: Secret
metadata:
  name: container-registry-credentials
  namespace: urbana-connect-hml
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "PLACEHOLDER_GITHUB_USERNAME",
          "password": "PLACEHOLDER_GITHUB_TOKEN_CLASSIC",
          "auth": "PLACEHOLDER_BASE64_USERNAME_COLON_TOKEN"
        }
      }
    }

# ATENÇÃO: Este é apenas um TEMPLATE e não deve ser aplicado diretamente.
# Para criar o secret real:
# 
# 1. Substitua os placeholders acima pelos valores reais
# 2. Use o kubectl para criar o secret:
#
# kubectl apply -f registry-secret.yaml
#
# OU crie manualmente com:
#
# kubectl create secret docker-registry container-registry-credentials \
#   --namespace=urbana-connect-hml \
#   --docker-server=ghcr.io \
#   --docker-username=seu_usuario_github \
#   --docker-password=seu_pat_classic_com_read_packages
