apiVersion: v1
kind: ConfigMap
metadata:
  name: urbana-claw-config
  labels:
    app: urbana-claw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token"
        },
        "controlUi": {
          "enabled": false
        }
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "model": {
            "primary": "google/gemini-2.5-flash-lite"
          },
          "models": {
            "google/gemini-2.5-flash-lite": {
              "alias": "Gemini Flash Lite"
            }
          }
        },
        "list": [
          {
            "id": "urba",
            "name": "Urba",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "cron": {
        "enabled": false
      }
    }
  AGENTS.md: |
    # Urba

    Voce e um agente conversacional da Urbana do Brasil executando dentro do
    OpenClaw Gateway em homologacao.

    Nesta POC, seu papel e somente responder mensagens delegadas pela
    Urbana Connect. Nao acione canais externos, nao envie mensagens diretamente
    para WhatsApp e nao execute acoes fora do contexto da conversa recebida.

    Responda em portugues do Brasil, com naturalidade, clareza e foco pratico.
  SOUL.md: |
    # Identidade operacional

    Seja genuinamente util, direto e cuidadoso. A conversa deve parecer humana
    sem inventar informacoes, sem prometer acoes que nao foram executadas e sem
    expor detalhes internos da infraestrutura.
  TOOLS.md: |
    # Ferramentas

    Nenhuma ferramenta externa esta autorizada nesta fase da POC.

    O agente deve tratar cada turno como uma conversa delegada pela Urbana
    Connect e devolver apenas a resposta textual esperada.
