apiVersion: v1
kind: Secret
metadata:
  name: urbana-connect-mongodb
  namespace: urbana-connect-hml
type: Opaque
stringData:
  username: "PLACEHOLDER_MONGODB_USERNAME"
  password: "PLACEHOLDER_MONGODB_PASSWORD"
  database: "urbana-connect"

# Template para o secret base do MongoDB em homolog.
# Gere também o secret `urbana-connect-mongodb-uri` para a aplicação.
