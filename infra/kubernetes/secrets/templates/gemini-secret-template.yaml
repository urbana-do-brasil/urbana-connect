apiVersion: v1
kind: Secret
metadata:
  name: urbana-connect-ai
  namespace: urbana-connect-hml
type: Opaque
stringData:
  GEMINI_API_KEY: "PLACEHOLDER_GEMINI_API_KEY"
  GEMINI_MODEL: "gemini-2.5-flash-lite"

# ATENÇÃO: Este é apenas um TEMPLATE e não deve ser aplicado diretamente.
# Para criar o secret real:
#
# kubectl create secret generic urbana-connect-ai \
#   --namespace=urbana-connect-hml \
#   --from-literal=GEMINI_API_KEY='sua_chave_real_do_gemini' \
#   --from-literal=GEMINI_MODEL='gemini-2.5-flash-lite' \
#   --dry-run=client -o yaml | kubectl apply -f -
