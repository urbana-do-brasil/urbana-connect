apiVersion: v1
kind: Secret
metadata:
  name: urbana-connect-terms
  namespace: urbana-connect-hml
type: Opaque
stringData:
  # Preencha somente com os artefatos aprovados pelo Jurídico. Não aplique
  # este template sem substituir todos os PLACEHOLDERs.
  TERMS_TOKEN_SECRET: "PLACEHOLDER_32_BYTE_SECRET"
  TERMS_DECOR_INTERIORES_VERSION: "PLACEHOLDER_VERSION"
  TERMS_DECOR_INTERIORES_RESOURCE: "PLACEHOLDER_APPROVED_RESOURCE"
  TERMS_DECOR_INTERIORES_CONTENT: "PLACEHOLDER_APPROVED_CONTENT"
  TERMS_DECOR_PINTURA_VERSION: "PLACEHOLDER_VERSION"
  TERMS_DECOR_PINTURA_RESOURCE: "PLACEHOLDER_APPROVED_RESOURCE"
  TERMS_DECOR_PINTURA_CONTENT: "PLACEHOLDER_APPROVED_CONTENT"
  TERMS_DECOR_FACHADA_VERSION: "PLACEHOLDER_VERSION"
  TERMS_DECOR_FACHADA_RESOURCE: "PLACEHOLDER_APPROVED_RESOURCE"
  TERMS_DECOR_FACHADA_CONTENT: "PLACEHOLDER_APPROVED_CONTENT"
  TERMS_DECOR_REFORMA_VERSION: "PLACEHOLDER_VERSION"
  TERMS_DECOR_REFORMA_RESOURCE: "PLACEHOLDER_APPROVED_RESOURCE"
  TERMS_DECOR_REFORMA_CONTENT: "PLACEHOLDER_APPROVED_CONTENT"

# Este é um template, não um secret de produção. Crie o secret real em cada
# namespace separadamente, com rotação e controle de acesso próprios.
