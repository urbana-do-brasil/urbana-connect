apiVersion: v1
kind: ConfigMap
metadata:
  name: hml-platform-local-config
  labels:
    app.kubernetes.io/part-of: urbana-connect-hml-platform-local
    environment: hml-platform-local
    non-production: "true"
data:
  ENVIRONMENT_NAME: hml-platform-local
  SERVER_PORT: "8081"
  SPRING_PROFILES_ACTIVE: hml
  HERMES_POC_ENABLED: "false"
  WEBHOOK_INBOX_WORKER_ENABLED: "true"
  WEBHOOK_INBOX_POLL_INTERVAL: 1s
  WEBHOOK_INBOX_ADMISSION_TIMEOUT: 30s
  WEBHOOK_INBOX_BATCH_SIZE: "50"
  TERMS_CONSENT_ENABLED: "false"
