# Dedicated hml-platform-local cluster. It is isolated from other local profiles and
# never updates the user's default kubeconfig or current context.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: urbana-hml-platform-local
servers: 1
agents: 0
image: docker.io/rancher/k3s:v1.36.4-k3s1@sha256:edad48e12bf81c3a09ac1c05c0c0ffaaa22145980b989d6fae84543a76b83657
kubeAPI:
  host: 127.0.0.1
  hostIP: 127.0.0.1
  hostPort: "6551"
options:
  k3d:
    wait: true
    timeout: "120s"
    disableLoadbalancer: false
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:0
      - arg: "--disable=servicelb"
        nodeFilters:
          - server:0
