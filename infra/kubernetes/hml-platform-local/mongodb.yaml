apiVersion: v1
kind: Service
metadata:
  name: mongodb
  labels:
    app: mongodb
    app.kubernetes.io/part-of: urbana-connect-hml-platform-local
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017
  selector:
    app: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app: mongodb
    app.kubernetes.io/part-of: urbana-connect-hml-platform-local
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        app.kubernetes.io/part-of: urbana-connect-hml-platform-local
        environment: hml-platform-local
        non-production: "true"
    spec:
      serviceAccountName: hml-platform-local-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: docker.io/library/mongo:8.0@sha256:376f5173003b5408d7b8e6989667231c0bf0cefdce379d7c814910429d1a7a85
          imagePullPolicy: Never
          command: ["mongod"]
          args:
            - --replSet=rs0
            - --bind_ip_all
            - --dbpath=/data/db
          ports:
            - name: mongodb
              containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
          startupProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet
                  'mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000'
                  --eval 'quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)'
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 36
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet
                  'mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000'
                  --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command:
                - sh
                - -ec
                - >-
                  mongosh --quiet
                  'mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000'
                  --eval 'quit(db.adminCommand({ping:1}).ok === 1 ? 0 : 1)'
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
        labels:
          app: mongodb
          app.kubernetes.io/part-of: urbana-connect-hml-platform-local
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
