name: urbana-connect-hermes-poc

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    hostname: mongodb
    command:
      - mongod
      - --replSet=rs0
      - --bind_ip_all
    networks:
      - data
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          'mongodb://127.0.0.1:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000' --eval
          'const hello = db.adminCommand({hello: 1}); quit(
          hello.ok === 1 && hello.setName === "rs0" &&
          hello.isWritablePrimary === true ? 0 : 1);'
      interval: 5s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true

  mongodb-rs-init:
    image: mongo:8.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - data
    command:
      - /bin/sh
      - -ec
      - |
        until mongosh --quiet \
          'mongodb://mongodb:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000' --eval '
          try { quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1); }
          catch (error) { quit(1); }
        '; do sleep 1; done

        until mongosh --quiet \
          'mongodb://mongodb:27017/admin?directConnection=true&serverSelectionTimeoutMS=3000' --eval '
          const hello = db.adminCommand({hello: 1});
          if (hello.setName === "rs0" && hello.isWritablePrimary === true) {
            quit(0);
          }
          try {
            rs.initiate({
              _id: "rs0",
              members: [{_id: 0, host: "mongodb:27017"}]
            });
          } catch (error) {}
          quit(1);
        '; do sleep 1; done

  hermes-profile-init:
    image: ${HERMES_IMAGE:-urbana-hermes-agent:pee-103-2f5472a15}
    restart: "no"
    user: "0:0"
    volumes:
      - hermes_data:/opt/data
      - ../../integrations/hermes-agent/profile/config.yaml.example:/profile/config.yaml:ro
    read_only: true
    tmpfs:
      - /run:rw,exec,nosuid,nodev,size=16m
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "-c"]
    command: ["cp /profile/config.yaml /opt/data/config.yaml"]

  urbana-connect:
    build:
      context: ../../apps/urbana-connect-api
      dockerfile: Dockerfile.poc.runtime-jar
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      mongodb-rs-init:
        condition: service_completed_successfully
    networks:
      - data
      - hermes_app
      - poc_ingress
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: poc
      SERVER_PORT: 8081
      MONGODB_URI: "mongodb://mongodb:27017/urbana-connect-poc?replicaSet=rs0&retryWrites=true&retryReads=true&w=majority"
      HERMES_BASE_URL: http://hermes:8642
      HERMES_API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?set HERMES_API_SERVER_KEY in .env.poc}
      HERMES_INTERNAL_TOOL_TOKEN: ${HERMES_INTERNAL_TOOL_TOKEN:?set HERMES_INTERNAL_TOOL_TOKEN in .env.poc}
      # The local synthetic ingress reuses the already-required internal token;
      # no second credential is introduced into the POC secret file.
      HERMES_POC_API_TOKEN: ${HERMES_INTERNAL_TOOL_TOKEN:?set HERMES_INTERNAL_TOOL_TOKEN in .env.poc}
      HERMES_MODEL: ${HERMES_MODEL:-openai/gpt-5.6-luna}
      HERMES_REASONING_EFFORT: ${HERMES_REASONING_EFFORT:-max}
      HERMES_SESSION_TIMEOUT_MS: ${HERMES_SESSION_TIMEOUT_MS:-180000}
      HERMES_ACTIVE_TURN_LEASE_SECONDS: ${HERMES_ACTIVE_TURN_LEASE_SECONDS:-240}
      HERMES_POC_CLAIM_TTL: ${HERMES_POC_CLAIM_TTL:-240s}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/readiness | grep -qx 'READY'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  poc-chat:
    build:
      context: ../../apps/poc-chat
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      urbana-connect:
        condition: service_healthy
    networks:
      - poc_ingress
    ports:
      - "127.0.0.1:${POC_CHAT_HOST_PORT:-3000}:8080"
    environment:
      # Reuse the already-required local POC credential. It is consumed only
      # by the Nginx startup renderer and never sent to the browser.
      HERMES_POC_API_TOKEN: ${HERMES_INTERNAL_TOOL_TOKEN:?set HERMES_INTERNAL_TOOL_TOKEN in .env.poc}
    read_only: true
    user: "101:101"
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101,mode=0755
      - /var/run:rw,nosuid,nodev,size=8m,uid=101,gid=101,mode=0755
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -qx 'ok'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  hermes:
    image: ${HERMES_IMAGE:-urbana-hermes-agent:pee-103-2f5472a15}
    build:
      context: ../../..
      dockerfile: urbana-connect/infra/local-poc/hermes-pee-103.Dockerfile
      args:
        HERMES_GIT_SHA: 2f5472a15a026b6bd5847ad65058f1565d2b40ba
    restart: unless-stopped
    depends_on:
      urbana-connect:
        condition: service_started
      openrouter-proxy:
        condition: service_started
      hermes-profile-init:
        condition: service_completed_successfully
    networks:
      - hermes_app
      - proxy_control
    environment:
      HERMES_HOME: /opt/data
      HERMES_UID: 10000
      HERMES_GID: 10000
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: 8642
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?set HERMES_API_SERVER_KEY in .env.poc}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in .env.poc}
      HERMES_INTERNAL_TOOL_TOKEN: ${HERMES_INTERNAL_TOOL_TOKEN:?set HERMES_INTERNAL_TOOL_TOKEN in .env.poc}
      URBANA_CONNECT_INTERNAL_URL: http://urbana-connect:8081
      HTTP_PROXY: http://openrouter-proxy:3128
      HTTPS_PROXY: http://openrouter-proxy:3128
      NO_PROXY: urbana-connect,hermes,localhost,127.0.0.1
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - hermes_data:/opt/data
      - ../../integrations/hermes-agent/profile/SOUL.md:/opt/data/SOUL.md:ro
      - ../../integrations/hermes-agent/plugins/urbana-domain:/opt/data/plugins/urbana-domain:ro
    read_only: true
    tmpfs:
      - /run:rw,exec,nosuid,nodev,size=32m
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    command: ["gateway", "run"]

  hermes-ingress-proxy:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      hermes:
        condition: service_started
    networks:
      - hermes_app
      - poc_ingress
    ports:
      - "127.0.0.1:${HERMES_POC_HOST_PORT:-8652}:8652"
    volumes:
      - ./nginx-hermes-ingress.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=32m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m
      - /var/run:rw,nosuid,nodev,size=8m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  openrouter-proxy:
    image: ubuntu/squid:6.10-24.10_edge
    restart: unless-stopped
    networks:
      - proxy_control
      - llm_egress
    volumes:
      - ./squid-openrouter.conf:/etc/squid/squid.conf:ro
    read_only: true
    tmpfs:
      - /run:rw,nosuid,nodev,size=16m
      - /var/log/squid:rw,noexec,nosuid,nodev,size=16m,uid=13,gid=13,mode=0755
      - /var/spool/squid:rw,noexec,nosuid,nodev,size=32m
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

networks:
  data:
    internal: true
  hermes_app:
    internal: true
  proxy_control:
    internal: true
  llm_egress: {}
  poc_ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_ip_forward: "false"

volumes:
  mongodb_data: {}
  hermes_data: {}
