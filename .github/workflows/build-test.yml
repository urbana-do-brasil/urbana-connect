name: Build, Test e Análise de Qualidade

on:
  workflow_dispatch:
  push:
    branches: [ main, hml ]
  pull_request:
    branches: [ main, hml ]

permissions:
  contents: read
  pull-requests: write  # Necessário para que o SonarCloud comente nos PRs
  checks: write         # Necessário para publicar status de qualidade

jobs:
  build_test_analyze:
    name: Build, Test e Análise
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      with:
        fetch-depth: 0  # SonarCloud precisa do histórico completo para algumas métricas

    - name: Configurar JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70  # v3.5.0

    - name: Garantir permissão de execução para gradlew
      run: chmod +x ./gradlew
      working-directory: ./apps/urbana-connect-api

    - name: Build e teste com Gradle
      run: ./gradlew build jacocoTestReport
      working-directory: ./apps/urbana-connect-api

    - name: Análise SonarCloud
      if: ${{ env.SONAR_TOKEN != '' }}
      run: ./gradlew sonar
      working-directory: ./apps/urbana-connect-api
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    - name: Publicar resultados de testes
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()  # Executa mesmo se passos anteriores falharem
      with:
        name: test-results
        path: apps/urbana-connect-api/build/reports/tests/

    - name: Publicar relatório de cobertura
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
      if: always()  # Executa mesmo se passos anteriores falharem
      with:
        name: coverage-report
        path: apps/urbana-connect-api/build/reports/jacoco/test/html/

  frontend_test:
    name: Testes do poc-chat
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

    - name: Configurar Node.js 24
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: apps/poc-chat/package-lock.json

    - name: Instalar dependências do chat
      run: npm ci
      working-directory: ./apps/poc-chat

    - name: Executar testes do chat
      run: npm run test -- --run
      working-directory: ./apps/poc-chat

    - name: Validar tipos
      run: npm run typecheck
      working-directory: ./apps/poc-chat

    - name: Validar lint
      run: npm run lint
      working-directory: ./apps/poc-chat

    - name: Gerar build do chat
      run: npm run build
      working-directory: ./apps/poc-chat
