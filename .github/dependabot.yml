version: 2
updates:
  # Dependências Java/Gradle
  - package-ecosystem: gradle
    directory: "/apps/urbana-connect-api"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "java"

  # Imagens Docker
  - package-ecosystem: docker
    directory: "/apps/urbana-connect-api"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "docker"

  # Dependências do chat manual local
  - package-ecosystem: npm
    directory: "/apps/poc-chat"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"

  # GitHub Actions — mantém as Actions atualizadas (e os SHAs pinados)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "dependencies"
      - "github-actions"
