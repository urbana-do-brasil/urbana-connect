spring:
  application:
    name: urbana-connect-poc
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/urbana-connect-poc}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8081}

management:
  health:
    mail:
      enabled: false

hermes:
  sessions:
    base-url: ${HERMES_BASE_URL:http://127.0.0.1:8652}
    api-server-key: ${HERMES_API_SERVER_KEY:}
    internal-tool-token: ${HERMES_INTERNAL_TOOL_TOKEN:}
    internal-tool-principal: ${HERMES_INTERNAL_TOOL_PRINCIPAL:hermes-urbana-domain}
    model: ${HERMES_MODEL:openai/gpt-5.6-luna}
    provider: openrouter
    reasoning-effort: ${HERMES_REASONING_EFFORT:max}
    timeout: ${HERMES_SESSION_TIMEOUT_MS:180000}ms
    lease-ttl: ${HERMES_ACTIVE_TURN_LEASE_SECONDS:240}s
  poc:
    enabled: true
    # Also activates the Hermes-first adapter for POST /api/webhook.
    api-token: ${HERMES_POC_API_TOKEN:}
    batch-flush-interval: ${HERMES_POC_BATCH_FLUSH_INTERVAL:1s}
    delay-threshold: ${HERMES_POC_DELAY_THRESHOLD:5s}
    worker-parallelism: ${HERMES_POC_WORKER_PARALLELISM:4}
    claim-ttl: ${HERMES_POC_CLAIM_TTL:240s}

logging:
  level:
    br.com.urbana.connect.infrastructure.hermes: INFO
